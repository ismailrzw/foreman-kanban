<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" style="background:#15130F; font-family: 'Inter', system-ui, sans-serif;">
  <!-- Header -->
  <rect x="0" y="0" width="900" height="60" fill="#1C1914" />
  <circle cx="35" cy="30" r="8" fill="#E8A23D" />
  <text x="55" y="36" fill="#F4EFE6" font-size="18" font-weight="700" letter-spacing="1">FOREMAN KANBAN — SYSTEM ARCHITECTURE</text>

  <!-- Client Tier -->
  <rect x="40" y="90" width="240" height="260" rx="10" fill="#1E1B16" stroke="#332D24" stroke-width="2"/>
  <rect x="40" y="90" width="240" height="40" rx="10" fill="#2A241C"/>
  <text x="60" y="116" fill="#E8A23D" font-size="14" font-weight="700">FRONTEND TIER (SPA)</text>
  <text x="60" y="155" fill="#F4EFE6" font-size="13" font-weight="600">React 19 + Vite 8</text>
  <text x="60" y="180" fill="#A09585" font-size="12">• Industrial Design System</text>
  <text x="60" y="200" fill="#A09585" font-size="12">• Role-Aware Dashboards</text>
  <text x="60" y="220" fill="#A09585" font-size="12">• Axios + Token Interceptor</text>
  <text x="60" y="240" fill="#A09585" font-size="12">• Inspection Queue UI</text>
  <rect x="60" y="280" width="200" height="36" rx="6" fill="#2A241C" stroke="#E8A23D" stroke-width="1"/>
  <text x="160" y="303" fill="#E8A23D" font-size="12" font-weight="600" text-anchor="middle">Hosted on Vercel</text>

  <!-- Auth Tier -->
  <rect x="330" y="90" width="240" height="110" rx="10" fill="#1E1B16" stroke="#FFCA28" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="350" y="120" fill="#FFCA28" font-size="14" font-weight="700">FIREBASE AUTHENTICATION</text>
  <text x="350" y="145" fill="#F4EFE6" font-size="12">• Email &amp; Password Auth</text>
  <text x="350" y="165" fill="#F4EFE6" font-size="12">• Email Verification Flow</text>
  <text x="350" y="185" fill="#F4EFE6" font-size="12">• Secure JWT ID Token Issuer</text>

  <!-- Backend Tier -->
  <rect x="330" y="230" width="240" height="220" rx="10" fill="#1E1B16" stroke="#332D24" stroke-width="2"/>
  <rect x="330" y="230" width="240" height="40" rx="10" fill="#2A241C"/>
  <text x="350" y="256" fill="#4CAF50" font-size="14" font-weight="700">BACKEND TIER (REST API)</text>
  <text x="350" y="295" fill="#F4EFE6" font-size="13" font-weight="600">FastAPI (Python 3.12)</text>
  <text x="350" y="320" fill="#A09585" font-size="12">• Firebase Admin SDK Auth</text>
  <text x="350" y="340" fill="#A09585" font-size="12">• Status Transition Engine</text>
  <text x="350" y="360" fill="#A09585" font-size="12">• Role Guard Middleware</text>
  <text x="350" y="380" fill="#A09585" font-size="12">• Motor Async MongoDB Driver</text>
  <rect x="350" y="400" width="200" height="34" rx="6" fill="#2A241C" stroke="#4CAF50" stroke-width="1"/>
  <text x="450" y="422" fill="#4CAF50" font-size="12" font-weight="600" text-anchor="middle">Hosted on Render</text>

  <!-- Database Tier -->
  <rect x="620" y="90" width="240" height="260" rx="10" fill="#1E1B16" stroke="#332D24" stroke-width="2"/>
  <rect x="620" y="90" width="240" height="40" rx="10" fill="#2A241C"/>
  <text x="640" y="116" fill="#47A248" font-size="14" font-weight="700">DATABASE TIER</text>
  <text x="640" y="155" fill="#F4EFE6" font-size="13" font-weight="600">MongoDB Atlas (M0 Cluster)</text>
  <text x="640" y="190" fill="#F4EFE6" font-size="12" font-weight="600">Collection: users</text>
  <text x="655" y="210" fill="#A09585" font-size="11">• firebase_uid, role, email</text>
  <text x="640" y="245" fill="#F4EFE6" font-size="12" font-weight="600">Collection: tasks</text>
  <text x="655" y="265" fill="#A09585" font-size="11">• stage, complexity, assignee</text>
  <text x="655" y="283" fill="#A09585" font-size="11">• feedback, history, timestamps</text>

  <!-- Connectors -->
  <path d="M 280 220 L 330 150" stroke="#E8A23D" stroke-width="2" stroke-dasharray="4" />
  <path d="M 280 240 L 330 310" stroke="#E8A23D" stroke-width="2" />
  <polygon points="325,305 335,310 325,315" fill="#E8A23D" />

  <path d="M 450 200 L 450 230" stroke="#FFCA28" stroke-width="2" />

  <path d="M 570 310 L 620 220" stroke="#4CAF50" stroke-width="2" />
  <polygon points="615,215 625,220 618,228" fill="#4CAF50" />
</svg>
